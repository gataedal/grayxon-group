name: Caixun TV Controller APK

on:
  push:
    branches:
      - caixun-tv-controller
      - caixun-tv-controller-enhanced
    paths:
      - "caixun-tv-controller/**"
      - ".github/workflows/caixun-tv-controller.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools and SDK packages
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Build and run Android Lint
        working-directory: caixun-tv-controller
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CaixunTVController-debug-apk
          path: caixun-tv-controller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
