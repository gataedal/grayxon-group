name: LIVE training isolated tests

on:
  push:
    branches:
      - rebuild-live-training-v2-isolated
  pull_request:
    paths:
      - "app.js"
      - "live-training-v2/**"
      - "supabase/functions/generate-jitsi-jwt/**"
      - "supabase/functions/end-live-training/**"
      - ".github/workflows/live-training-tests.yml"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run LIVE policy and source-contract tests
        run: node --test live-training-v2/permissions.test.js live-training-v2/source-contract.test.js
