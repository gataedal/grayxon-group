name: Gestión follow-up checks

on:
  push:
    branches:
      - feature/gestion-module-2026-11-26
    paths:
      - 'grayxon-followup-*.js'
      - 'grayxon-trabajo.js'
      - 'tests/grayxon-followup-*.test.js'
      - 'supabase/migrations/*.sql'
      - 'docs/gestion-preflight-backup-and-release.md'
      - '.github/workflows/gestion-followup-checks.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'grayxon-followup-*.js'
      - 'grayxon-trabajo.js'
      - 'tests/grayxon-followup-*.test.js'
      - 'supabase/migrations/*.sql'
      - '.github/workflows/gestion-followup-checks.yml'

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Gestión JavaScript syntax
        run: node --check grayxon-trabajo.js && node --check grayxon-followup-import.js && node --check grayxon-followup-calculations.js
      - name: Test evaluation calculations
        run: node tests/grayxon-followup-calculations.test.js
      - name: Test Excel import parser
        run: node tests/grayxon-followup-import.test.js
      - name: Install PostgreSQL SQL parser
        run: python -m pip install --disable-pip-version-check pglast
      - name: Parse every repository SQL migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          files = sorted(Path("supabase/migrations").glob("*.sql"))
          for path in files:
              parse_sql(path.read_text(encoding="utf-8"))
              print(f"SQL syntax OK: {path}")
          print(f"Validated {len(files)} migration file(s).")
          PY
