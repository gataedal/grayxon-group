<html lang="es">
<head>

  <meta name="color-scheme" content="dark">
  <title>Grayxon Trabajo</title>
  <link rel="icon" type="image/png" href="assets/grayxon-logo.png">

<body>
  <section id="gxLogin" class="gxt-login-wrap">

      <div class="gxt-brand"><img class="gxt-logo" src="assets/grayxon-logo.png" alt=""><div><strong>GRAYXON</strong><small>TRABAJO</small></div></div>

      <div id="gxLoginError" class="gxt-error" aria-live="polite"></div>
    </div>
  </section>

  <div id="gxApp" class="gxt-shell" hidden>

      <div class="gxt-brand">
        <img class="gxt-logo" src="assets/grayxon-logo.png" alt="">
        <div><strong>GRAYXON</strong><small>TRABAJO · GESTIÓN OPERATIVA</small></div>
      </div>
      <div class="gxt-user">
        <div class="gxt-user-info"><strong id="gxUserName">Equipo Grayxon</strong><small id="gxUserJob"></small></div>
        <span id="gxAccessBadge" class="gxt-access">Operativo</span>
      </div>
    </header>

    <div class="gxt-layout">
      <nav id="gxNav" class="gxt-nav" aria-label="Grayxon Trabajo"></nav>
      <main id="gxMain" class="gxt-main" aria-live="polite"></main>
    </div>
  </div>

  <div id="gxModalRoot" class="gxt-modal-root"></div>
  <div id="gxToast" class="gxt-toast" hidden></div>
