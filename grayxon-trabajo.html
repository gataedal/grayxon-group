<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080a0d">
  <meta name="color-scheme" content="dark">
  <title>Grayxon Trabajo</title>
  <link rel="icon" type="image/png" href="assets/grayxon-logo.png">
  <link rel="stylesheet" href="grayxon-trabajo.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <section id="gxLogin" class="gxt-login-wrap">
    <div class="gxt-login">
      <div class="gxt-brand"><img class="gxt-logo" src="assets/grayxon-logo.png" alt=""><div><strong>GRAYXON</strong><small>TRABAJO</small></div></div>
      <h1>Gestión interna</h1>
      <p id="gxLoginMessage">Validando tu sesión del portal Grayxon…</p>
      <div id="gxLoginError" class="gxt-error" aria-live="polite"></div>
    </div>
  </section>

  <div id="gxApp" class="gxt-shell" hidden>
    <header class="gxt-top">
      <div class="gxt-brand">
        <img class="gxt-logo" src="assets/grayxon-logo.png" alt="">
        <div><strong>GRAYXON</strong><small>TRABAJO · GESTIÓN OPERATIVA</small></div>
      </div>
      <div class="gxt-user">
        <div class="gxt-user-info"><strong id="gxUserName">Equipo Grayxon</strong><small id="gxUserJob"></small></div>
        <span id="gxAccessBadge" class="gxt-access">Operativo</span>
      </div>
    </header>

    <div class="gxt-layout">
      <nav id="gxNav" class="gxt-nav" aria-label="Grayxon Trabajo"></nav>
      <main id="gxMain" class="gxt-main" aria-live="polite"></main>
    </div>
  </div>

  <div id="gxModalRoot" class="gxt-modal-root"></div>
  <div id="gxToast" class="gxt-toast" hidden></div>

  <nav class="gx-bottom-nav" id="gxTrabajoBottomNav" aria-label="Navegación principal de Grayxon">
    <a href="portal.html#admin" aria-label="Inicio"><span class="gx-nav-icon" aria-hidden="true">⌂</span><span>Inicio</span></a>
    <a href="portal.html#admin" aria-label="Notificaciones"><span class="gx-nav-icon" aria-hidden="true">♧</span><span>Notificaciones</span></a>
    <a href="portal.html#admin" aria-label="Calendario"><span class="gx-nav-icon" aria-hidden="true">▦</span><span>Calendario</span></a>
    <a href="portal.html#profile" aria-label="Perfil"><span class="gx-nav-icon" aria-hidden="true">♙</span><span>Perfil</span></a>
  </nav>

  <script src="grayxon-trabajo.js?v=3"></script>
</body>
</html>
